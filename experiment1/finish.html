<!DOCTYPE html>
<html lang="ja" class="webp webp-alpha webp-animation webp-lossless">

<head>
   <title>卒業研究実験１</title>
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- CSS -->
   <link rel="stylesheet" type="text/css" href="./css/reset.css">
   <link rel="stylesheet" type="text/css" href="./css/style.css">

   <!-- font data -->
   <link rel="preconnect" href="https://fonts.gstatic.com">
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500&family=Noto+Sans+JP:wght@700&family=Oswald:wght@700&display=swap">
   
</head>


<body class="finish-page">

   <main class="finish-main">
      <div class="main_inner">

         <div class="main_title">
            Googleフォーム回答時に、以下の被験者IDを入力とパターンの選択をしてください。
         </div>

         <div class="main_detail">
            <p id="participantIdDisplay"></p>
            <p id="patternDisplay"></p>
         </div>
         
         <button id="finishbutton" onclick="saveAndOpenForm()">
            Googleフォームへ進む
         </button>

         <!-- <div class="main_title">
            条件1のスクロール速度
         </div>
         <div class="main_detail">
            <p id="baselineValue"></p>
         </div>
         
         <div class="main_title">
            滞在時間確認
         </div>
         <div class="main_detail">
            <p id="condition1Time"></p>
            <p id="condition2Time"></p>
            <p id="condition3Time"></p>
         </div>

         <div class="main_detail">
            <p id="highlightTriggered"></p>
            <p id="highlightTriggerTime"></p>
         </div> -->
         
      </div>
   </main>

   <footer class="footer">
      <div class="footer_inner">

         <div class="footer_list">
            <p class="footer_item">
                  実験に関する質問とアンケートは、卒業研究でのみ使用させていただきます。
            </p>
         </div>

      </div>
   </footer>
   
   <!-- js -->
   <script src="./js/dynamicHighlight.js"></script>

   <script>
      // 被験者IDがまだ無ければ発行
      if (!localStorage.getItem("participantId")) {
   
         const participantId =
            "S" +
            String(Math.floor(Math.random() * 10000))
            .padStart(4, "0");
   
         localStorage.setItem(
            "participantId",
            participantId
         );
      }
   
      const participantId =
         localStorage.getItem("participantId");
   
      const pattern =
         localStorage.getItem("experimentPattern");
   
      document.getElementById("participantIdDisplay").textContent =
         "被験者ID：" + participantId;
   
      document.getElementById("patternDisplay").textContent =
         "あなたの実験パターン：" + pattern;
   </script>
   
   <script>
     const baselineSpeed = Number(localStorage.getItem("baselineSpeed"));
     document.getElementById("baselineValue").textContent = baselineSpeed + " px/ms";
   </script>

   <script>
     document.getElementById("condition1Time").textContent =
       "条件1滞在時間：" +
       localStorage.getItem("condition1Time") +
       " 秒";
   
     document.getElementById("condition2Time").textContent =
       "条件2滞在時間：" +
       localStorage.getItem("condition2Time") +
       " 秒";
   
     document.getElementById("condition3Time").textContent =
       "条件3滞在時間：" +
       localStorage.getItem("condition3Time") +
       " 秒";
   </script>

   <script>
     document.getElementById("highlightTriggered").textContent =
     "強調発生：" +
     localStorage.getItem("highlightTriggered");
   
     document.getElementById("highlightTriggerTime").textContent =
     "強調発生時刻：" +
     localStorage.getItem("highlightTriggerTime") +
     " 秒";
   </script>

   <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
   <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
   <script src="./js/firebase.js"></script>

</body>
</html>
